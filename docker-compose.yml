services:

  backend:
    build: .
    container_name: microblog_app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    command: ["./main"]

  db:
    image: postgres:16.0
    container_name: microblog_db
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrator:
    build: .
    container_name: microblog_migrator
    env_file: .env 
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations 
    command: >
      sh -c "
        /go/bin/goose -dir /migrations postgres "postgres://$DB_USER:$DB_PASSWORD@db:$DB_PORT/$DB_NAME?sslmode=disable" up
      "
    restart: "no"
    
volumes:
  postgres_data:
      name: microblog_postgres_data