services:
  db:
    image: postgres:16.0
    container_name: microblog_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:                         
      - postgres_data:/var/lib/postgresql/data

  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: microblog_kafka
    command:
      [
        "redpanda",
        "start",
        "--overprovisioned",
        "--smp", "1",
        "--memory", "512M",
        "--reserve-memory", "0M",
        "--node-id", "0",
        "--check=false",
        "--kafka-addr", "PLAINTEXT://0.0.0.0:9092",
        "--advertise-kafka-addr", "PLAINTEXT://kafka:9092"
      ]
    ports:
      - "9092:9092"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: microblog_api
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8080:8080"

  engagement:
    build:
      context: .
      dockerfile: Dockerfile.engagement
    container_name: microblog_engagement
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8090:8090"

  migrator:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: microblog_migrator
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "/go/bin/goose -dir /migrations postgres
      \"postgres://$DB_USER:$DB_PASSWORD@db:5432/$DB_NAME?sslmode=disable\" up"
    restart: "no"

volumes:
  postgres_data:
    name: microblog_postgres_data
